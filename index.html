"Jakie pytanie zadasz podczas przeglądu projektu?|Czy decyzje dotyczące marki podejmują właściwe osoby?|Czy współpracownicy znajdują wsparcie i tworzą spójne materiały?|Czy zatwierdzone zastosowania AI przynoszą korzyści przy odpowiedniej weryfikacji?|Czy ekosystem zapewnia potrzebne możliwości?",
"Który wkład utrzyma Twoje zainteresowanie na dłużej?|Pomaganie zespołom w podejmowaniu jasnych, proporcjonalnych decyzji dotyczących marki.|Ułatwianie współpracownikom codziennej pracy z marką.|Wyciąganie wniosków z pilotaży AI i ulepszanie odpowiedzialnych procesów.|Ulepszanie współpracy systemów i możliwości produkcyjnych."

sv: [
"Vilken utmaning skulle du helst vilja reda ut?|Otydligt ansvar för beslut om varumärket.|Mallar och stöd som är svåra att hitta.|Osäkerhet om när AI behöver mänsklig granskning.|Produktionssystem som saknar viktiga funktioner.",
"Vilket resultat skulle du vara mest stolt över?|En tydlig karta över beslutsmandat och godkännandevägar.|Återanvändbara mallar med exempel på bra arbete.|Ett testat AI-arbetsflöde med mänsklig granskning.|En praktisk rekommendation för produktionsekosystemet.",
"Vilken workshopaktivitet skulle du helst leda?|Enas om ansvar och delegerade befogenheter.|Kartlägga hur kollegor hittar resurser och ber om stöd.|Välja AI-användningsfall och mätetal för ett pilotprojekt.|Jämföra dagens system med framtida krav.",
"Vilken detalj fångar naturligt din uppmärksamhet?|Om en regel är proportionerlig och har en tydlig ägare.|Om en resurs är användbar, enhetlig och aktuell.|Om ett AI-resultat behöver ytterligare mänsklig granskning.|Om system överlappar, lämnar luckor eller ökar kostnader.",
"Vilken förbättring skulle kännas mest givande?|Varumärkesbeslut följer tydliga godkännandevägar.|Kollegor kan enkelt skapa bra material och hitta hjälp.|Ett AI-pilotprojekt ger mätbar nytta med lämplig tillsyn.|En genomförandeplan täpper till luckor i produktionsförmågan.",
"Vilket samtal skulle du uppskatta mest?|Hur ska byråer hantera ovanliga varumärkesförfrågningar?|Vad skulle göra vår stödportal mer användbar?|Var bör AI stödja mediearbetet, och var går gränsen?|Vilka funktioner ska våra system erbjuda, och till vilken kostnad?",
"Du har en eftermiddag att bidra. Vad väljer du?|Skriva vägledning för eskalering av varumärkesbeslut.|Förbättra en mall, dess exempel och versionsregler.|Utforma ett AI-experiment med granskningskriterier.|Kartlägga produktionsverktyg och luckorna mellan dem.",
"Vilket löpande ansvar lockar dig mest?|Hålla varumärkesstyrningen tydlig och praktiskt användbar.|Hålla mallar och vägen till stöd användbara.|Omsätta godkänd AI-användning i granskade arbetssätt.|Planera införande och förvaltning av ekosystemet.",
"En kampanj är försenad. Vilken orsak undersöker du först?|Ingen vet vem som ger det slutliga godkännandet.|Teamet hittar inte lämpligt material eller rätt mallar.|AI-genererat innehåll saknar en överenskommen granskningsprocess.|Produktionsverktyg som inte hänger ihop fördröjer överlämningar.",
"Vad vill du helst få veta av kollegorna?|Var ansvaret för beslut är otydligt.|Var resurser eller förfrågningar om stöd känns förvirrande.|Vilka återkommande uppgifter som kan gynnas av godkänd AI.|Vilka systembegränsningar som hindrar dem i arbetet.",
"Vilken avvägning skulle du uppskatta att arbeta med?|Tillräcklig kontroll utan onödiga godkännandesteg.|Enhetliga mallar som ändå ger kreativ frihet.|AI-effektivitet i balans med mänskligt omdöme.|Nödvändiga funktioner i balans med kostnad och komplexitet.",
"Vilket underlag skulle du helst samla in?|Exempel på beslut som eskalerats i onödan.|Återkoppling från kollegor som testar stödportalen.|Mätbara resultat från ett pilotprojekt med AI-arbetsflöden.|En översikt över systemens funktioner, beroenden och kostnader.",
"Du ska skriva en vägledning. Vad handlar den om?|Vem som får besluta, godkänna eller medge undantag.|Hur man använder mallar och får rätt stöd.|Hur man använder godkänd AI och granskar resultaten.|Hur produktionsekosystemet hänger ihop och förvaltas.",
"Vilket litet experiment väljer du?|Testa en delegerad godkännandeväg för rutinärenden.|Testa om kollegor snabbt hittar rätt resurs.|Jämföra en granskad AI-stödd uppgift med dagens metod.|Kontrollera om ett föreslaget system uppfyller ett funktionskrav.",
"Vad vill du helst förklara för en ny kollega?|När personen själv kan fatta ett varumärkesbeslut.|Var mallar, exempel och introduktionsmaterial finns.|Vilken AI-användning som är godkänd och när en granskare behövs.|Vilka produktionssystem som fyller olika behov.",
"Vilken inkonsekvens vill du helst åtgärda?|Team tolkar ansvaret för godkännanden olika.|Team använder inaktuella mallar eller motstridiga exempel.|AI används på olika sätt utan gemensamma granskningskrav.|Flera verktyg erbjuder samma funktion medan en annan saknas.",
"Vad vill du helst ansvara för när projektet är klart?|En överenskommen process för styrning och undantag.|En förvaltad uppsättning mallar och en användbar väg till stöd.|AI-vägledning, utbildning och resultat från pilotprojekt.|En färdplan för ekosystemet med planer för införande och förvaltning.",
"En föreslagen förändring får blandad respons. Vad undersöker du?|Om beslutsmandat och eskaleringsvägar är tydliga.|Om människor förstår och kan använda de nya resurserna.|Om AI-nyttan och granskningskraven har stöd i underlaget.|Om krav, kostnader och beroenden är väl förstådda.",
"Vilken fråga skulle du ställa vid en projektuppföljning?|Fattas varumärkesbeslut av rätt personer?|Kan kollegor hitta stöd och skapa enhetligt material?|Ger godkänd AI-användning nytta med lämplig granskning?|Ger ekosystemet oss de förmågor vi behöver?",
"Vilket bidrag skulle hålla ditt intresse uppe över tid?|Hjälpa team att fatta tydliga och proportionerliga varumärkesbeslut.|Göra kollegornas dagliga varumärkesarbete enklare.|Dra lärdom av AI-piloter och förbättra ansvarsfulla arbetsflöden.|Förbättra samspelet mellan produktionsförmågor och system."
],
it: [
"Quale problema vorresti affrontare per primo?|Responsabilità poco chiare nelle decisioni sul brand.|Modelli e supporto difficili da trovare.|Dubbi su quando l’AI richieda la supervisione umana.|Sistemi di produzione privi di funzionalità importanti.",
"Quale risultato ti renderebbe più orgoglioso del tuo contributo?|Una mappa chiara dei poteri decisionali e dei percorsi di approvazione.|Modelli riutilizzabili con esempi di buon lavoro.|Un flusso di lavoro con AI testato e sottoposto a revisione umana.|Una raccomandazione pratica per l’ecosistema di produzione.",
"Quale attività di un workshop ti piacerebbe guidare?|Concordare responsabilità e deleghe.|Mappare come i colleghi trovano risorse e richiedono supporto.|Scegliere casi d’uso dell’AI e indicatori per un progetto pilota.|Confrontare i sistemi attuali con i requisiti futuri.",
"Quale dettaglio attira spontaneamente la tua attenzione?|Se una regola è proporzionata e ha un responsabile chiaro.|Se una risorsa è utile, coerente e aggiornata.|Se un risultato dell’AI richiede un’ulteriore revisione umana.|Se i sistemi si sovrappongono, lasciano lacune o aggiungono costi.",
"Quale miglioramento ti darebbe più soddisfazione?|Le decisioni sul brand seguono percorsi di approvazione chiari.|I colleghi producono facilmente buon materiale e trovano aiuto.|Un progetto pilota con AI offre benefici misurabili con supervisione adeguata.|Un piano di implementazione colma le lacune nelle capacità produttive.",
"Quale conversazione ti interesserebbe di più?|Come dovrebbero gestire le agenzie le richieste insolite sul brand?|Cosa renderebbe più utile il nostro portale di supporto?|Dove dovrebbe aiutare l’AI nel lavoro sui media e dove dovrebbe fermarsi?|Quali funzionalità dovrebbero offrire i nostri sistemi e a quale costo?",
"Hai un pomeriggio da dedicare al progetto. Cosa scegli?|Scrivere indicazioni su quando inoltrare una decisione sul brand a un livello superiore.|Migliorare un modello, i suoi esempi e le regole di versionamento.|Progettare un esperimento con AI e criteri di revisione.|Mappare gli strumenti di produzione e le lacune tra loro.",
"Quale responsabilità continuativa ti interessa di più?|Mantenere chiara e praticabile la governance del brand.|Mantenere utili i modelli e il percorso di accesso al supporto.|Tradurre gli usi approvati dell’AI in modalità di lavoro sottoposte a revisione.|Pianificare l’implementazione e il supporto dell’ecosistema.",
"Una campagna è in ritardo. Quale causa esamineresti per prima?|Nessuno sa chi debba dare l’approvazione finale.|Il team non trova materiali o modelli adatti.|I contenuti generati dall’AI non hanno un processo di revisione concordato.|Strumenti di produzione scollegati rallentano i passaggi di lavoro.",
"Cosa vorresti soprattutto sapere dai colleghi?|Dove le responsabilità decisionali sono ambigue.|Quali risorse o richieste di supporto risultano poco chiare.|Quali attività ripetitive potrebbero beneficiare dell’AI approvata.|Quali limiti dei sistemi impediscono di svolgere il lavoro.",
"Su quale equilibrio ti piacerebbe lavorare?|Una supervisione sufficiente senza approvazioni superflue.|Modelli coerenti che lascino spazio alla creatività.|Efficienza dell’AI bilanciata con il giudizio umano.|Funzionalità necessarie bilanciate con costi e complessità.",
"Quali informazioni preferiresti raccogliere?|Esempi di decisioni inoltrate inutilmente a un livello superiore.|Feedback dei colleghi che provano il portale di supporto.|Risultati misurati di un progetto pilota con AI.|Un inventario di funzionalità, dipendenze e costi dei sistemi.",
"Ti viene chiesto di scrivere una guida. Su cosa ti concentri?|Chi può decidere, approvare o concedere un’eccezione.|Come usare i modelli e richiedere il supporto giusto.|Come usare l’AI approvata e verificarne i risultati.|Come si integrano e vengono gestiti gli elementi dell’ecosistema di produzione.",
"Quale piccolo esperimento sceglieresti?|Provare un percorso di approvazione delegata per le richieste ordinarie.|Verificare se i colleghi trovano rapidamente la risorsa giusta.|Confrontare un’attività assistita dall’AI e revisionata con il metodo attuale.|Verificare se un sistema proposto soddisfa un requisito funzionale.",
"Cosa vorresti soprattutto chiarire a un nuovo collega?|Quando può prendere autonomamente una decisione sul brand.|Dove trovare modelli, esempi e materiali introduttivi.|Quali usi dell’AI sono approvati e quando coinvolgere un revisore.|Quali sistemi di produzione rispondono alle diverse esigenze.",
"Quale incoerenza vorresti correggere?|I team interpretano diversamente le responsabilità di approvazione.|I team usano modelli obsoleti o esempi contrastanti.|L’AI viene usata in modi diversi senza requisiti comuni di revisione.|Più strumenti duplicano una funzionalità, mentre ne manca un’altra.",
"Di cosa preferiresti essere responsabile alla fine del progetto?|Un processo concordato di governance e gestione delle eccezioni.|Una raccolta di modelli aggiornata e un percorso di supporto utilizzabile.|Linee guida sull’AI, formazione e risultati dei progetti pilota.|Una roadmap dell’ecosistema con piani di implementazione e supporto.",
"Una modifica proposta riceve opinioni contrastanti. Cosa approfondisci?|Se i poteri decisionali e i percorsi di escalation sono chiari.|Se le persone comprendono e riescono a usare le nuove risorse.|Se i benefici dell’AI e i requisiti di revisione sono supportati da evidenze.|Se requisiti, costi e dipendenze sono compresi.",
"Quale domanda faresti durante una revisione del progetto?|Le decisioni sul brand vengono prese dalle persone giuste?|I colleghi trovano supporto e producono materiale coerente?|Gli usi approvati dell’AI creano valore con una revisione adeguata?|L’ecosistema offre le capacità di cui abbiamo bisogno?",
"Quale contributo manterrebbe vivo il tuo interesse nel tempo?|Aiutare i team a prendere decisioni chiare e proporzionate sul brand.|Semplificare il lavoro quotidiano dei colleghi sul brand.|Imparare dai progetti pilota con AI e migliorare flussi di lavoro responsabili.|Migliorare l’integrazione tra capacità produttive e sistemi."
]

'use strict';
const $=id=>document.getElementById(id);
const lengths=[8,12,20];
let language='en',size=20,current=0,screen='intro',answers=Array(20).fill(null);
const t=(key,vars={})=>ui[language][key].replace(/\{(\w+)\}/g,(_,k)=>vars[k]??'');
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function calculate(values){
 if(!lengths.includes(values.length)||values.some(v=>!Number.isInteger(v)||v<0||v>3))throw Error('Incomplete or invalid answers');
 const counts=[0,0,0,0];values.forEach(v=>counts[v]++);
 const max=Math.max(...counts);
 return {counts,percentages:counts.map(n=>n/values.length*100),winners:counts.flatMap((n,i)=>n===max?[i]:[])};
}
function formatPercent(n){return new Intl.NumberFormat(language,{maximumFractionDigits:1}).format(n)+'%'}
function show(next){screen=next;['intro','quiz','results'].forEach(id=>$(id).hidden=id!==next);$('main').classList.toggle('results',next==='results')}
function translate(){
 document.documentElement.lang=language;
 document.title='Project Starling · '+t('introLabel');
 document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $('photo').alt=t('photo');$('copyFallback').setAttribute('aria-label',t('copyLabel'));
 $('progressOuter').setAttribute('aria-label',t('answered'));
 $('streams').replaceChildren(...categoryText[language].map((c,i)=>{const li=el('li');li.append(el('span','0'+(i+2),'badge'),el('span',c[1]));return li}));
 lengths.forEach((n,i)=>{$('lengthLabel'+n).textContent=ui[language].lengths[i];$('time'+n).textContent=ui[language].times[i]});
 if(screen==='quiz')renderQuestion(false);
 if(screen==='results')renderResults(false);
}
function updateProgress(){
 const n=answers.filter(a=>a!==null).length;
 $('progress').style.width=`${100*n/size}%`;
 $('progressOuter').setAttribute('aria-valuemax',size);
 $('progressOuter').setAttribute('aria-valuenow',n);
}
function renderQuestion(focus=true){
 show('quiz');$('step').textContent=t('step',{x:current+1,n:size});updateProgress();
 const [q,...options]=banks[language][current].split('|');
 $('questionTitle').textContent=q;$('options').replaceChildren();
 for(let k=0;k<4;k++){
  const c=(k+current)%4,label=el('label',undefined,'option'),input=el('input');
  input.type='radio';input.name='answer';input.value=c;input.checked=answers[current]===c;
  input.onchange=()=>{answers[current]=c;$('next').disabled=false;updateProgress()};
  label.append(input,el('span',options[c]));$('options').append(label);
 }
 $('next').disabled=answers[current]===null;
 $('next').textContent=t(current===size-1?'finish':'next');
 if(focus)$('questionTitle').focus();
}
function resultText(){
 const r=calculate(answers),cats=categoryText[language];
 return `Project Starling — ${t('mix')}\n${r.winners.length>1?t('tie',{n:r.winners.length}):t('best')}: ${r.winners.map(i=>`${i+2}. ${cats[i][0]}`).join(' / ')}\n\n${cats.map((c,i)=>`${i+2}. ${c[0]}: ${formatPercent(r.percentages[i])}`).join('\n')}\n\n${t('based',{n:size})}\n${t('introNote')}`;
}
function renderResults(focus=true){
 const r=calculate(answers),cats=categoryText[language];show('results');
 $('recommendation').replaceChildren(el('div',r.winners.length>1?t('tie',{n:r.winners.length}):t('best'),'eyebrow'));
 r.winners.forEach(i=>$('recommendation').append(el('h2',`${i+2}. ${cats[i][0]}`),el('p',cats[i][2])));
 if(r.winners.length>1)$('recommendation').append(el('p',t('tieNote')));
 $('scores').replaceChildren(...cats.map((c,i)=>{
  const row=el('div',undefined,'score'),label=el('div',undefined,'score-label'),track=el('div',undefined,'track'),fill=el('div',undefined,'fill');
  label.append(el('span',`0${i+2} · ${c[1]}`),el('span',formatPercent(r.percentages[i])));
  track.setAttribute('aria-hidden','true');fill.style.width=r.percentages[i]+'%';track.append(fill);row.append(label,track);return row;
 }));
 $('method').textContent=t('method',{n:size});
 $('nextStep').replaceChildren(el('strong',t('nextTitle')),...r.winners.map(i=>el('p',`${t('workstream')} ${i+2}: ${cats[i][3]}`)),el('p',t('nextNote')));
 $('status').textContent='';$('copyFallback').hidden=true;
 if(focus)$('resultsTitle').focus();
}
$('language').onchange=e=>{language=e.target.value;translate()};
$('start').onclick=()=>{
 const selected=Number(document.querySelector('input[name=length]:checked').value);
 if(selected!==size){size=selected;answers=Array(size).fill(null);current=0}
 renderQuestion();
};
$('back').onclick=()=>{if(current>0){current--;renderQuestion()}else{show('intro');$('start').focus()}};
$('questionForm').onsubmit=e=>{e.preventDefault();if(answers[current]===null)return;if(current<size-1){current++;renderQuestion()}else renderResults()};
$('review').onclick=()=>{current=0;renderQuestion()};
$('restart').onclick=()=>{answers=Array(size).fill(null);current=0;show('intro');$('start').focus()};
$('print').onclick=()=>window.print();
async function copyResults(){
 const text=resultText(),copyLanguage=language;
 try{await navigator.clipboard.writeText(text);if(copyLanguage===language&&screen==='results')$('status').textContent=t('copied')}
 catch{if(copyLanguage!==language||screen!=='results')return;const field=$('copyFallback');field.hidden=false;field.value=text;field.focus();field.select();$('status').textContent=t('copyHelp')}
}
$('copy').onclick=copyResults;
translate();
</script></body></html>
